<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="ITMajdoor — random 1-on-1 video and text chat to connect with fellow IT engineers. Just for fun. No accounts, no data stored." />
    <meta name="theme-color" content="#ff8a00" />
    <title>ITMajdoor — Random chat for IT folks</title>
    <script>
      // Apply the saved/OS theme before paint to avoid a flash of the wrong
      // theme (and the layout shift that comes with it).
      (function () {
        try {
          var t = localStorage.getItem("itmajdoor-theme");
          if (!t) {
            t = window.matchMedia("(prefers-color-scheme: dark)").matches
              ? "dark"
              : "light";
          }
          if (t === "dark") document.documentElement.classList.add("dark");
        } catch (e) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
